<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Esports Battle - Tournament App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0F172A; color: #F8FAFC; padding-bottom: 70px; }
        header { background: #1E293B; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; color: #FB923C; font-weight: 800; }
        .wallet-badge { background: #0F172A; border: 1px solid #FB923C; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #FFF; display: flex; align-items: center; gap: 6px; }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #1E293B; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #C2410C; color: #FFF; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
        .match-info { color: #94A3B8; font-size: 13px; margin-bottom: 12px; }
        
        .stats-row { display: flex; justify-content: space-between; background: #0F172A; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
        .stat-box div:first-child { font-size: 11px; color: #94A3B8; }
        .stat-box div:last-child { font-size: 14px; font-weight: bold; }
        .prize { color: #FBBF24; }
        .per-kill { color: #34D399; }
        .spots { color: #FB923C; }

        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-join { background: #EA580C; color: #FFF; }
        .btn-joined { background: #475569; color: #94A3B8; cursor: not-allowed; }
        .btn-success { background: #16A34A; color: #FFF; }

        .room-box { background: #0F172A; border: 1px dashed #34D399; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1E293B; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 100; }
        nav button { background: none; border: none; color: #94A3B8; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #FB923C; }
        nav button svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 FF ESPORTS BATTLE</h1>
        <div class="wallet-badge">
            <span>💰</span> <span id="wallet-balance">150</span> INR
        </div>
    </header>

    <div class="container">
        <!-- Tournaments Tab -->
        <div id="tab-tournaments" class="tab-content active">
            <div id="tournament-list"></div>
        </div>

        <!-- My Matches Tab -->
        <div id="tab-matches" class="tab-content">
            <div id="joined-list"></div>
        </div>

        <!-- Wallet Tab -->
        <div id="tab-wallet" class="tab-content">
            <div class="card" style="text-align: center; background: linear-gradient(135deg, #C2410C, #9A3412);">
                <div style="font-size: 14px; color: #FFEDD5;">Total Balance</div>
                <div style="font-size: 32px; font-weight: bold; margin: 10px 0;" id="wallet-balance-box">₹150</div>
                <button class="btn" style="background: #FFF; color: #C2410C; margin-top: 10px;" onclick="addMoney()">+ Add ₹100 Test Cash</button>
            </div>
        </div>

        <!-- Profile Tab -->
        <div id="tab-profile" class="tab-content">
            <div class="card" style="text-align: center;">
                <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
                <h3>ZETSU Player</h3>
                <p style="color: #94A3B8; font-size: 13px;">Free Fire UID: 4892019283</p>
                <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="color: #94A3B8;">Matches Played</span>
                    <span style="font-weight: bold;">12</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #94A3B8;">Tournaments Won</span>
                    <span style="font-weight: bold; color: #FBBF24;">3</span>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <button class="active" onclick="switchTab('tournaments', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Tournaments
        </button>
        <button onclick="switchTab('matches', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            My Matches
        </button>
        <button onclick="switchTab('wallet', this)">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Wallet
        </button>
        <button onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </button>
    </nav>

    <script>
        let walletBalance = 150;
        let tournaments = [
            { id: 1, title: "Daily Custom Squad #45", map: "Bermuda", time: "Today, 08:00 PM", prize: "₹1,200", perKill: "₹8", entryFee: 25, spotsLeft: 12, totalSpots: 48, joined: false, roomId: "FF_9821", roomPass: "zetsu99" },
            { id: 2, title: "Solo Clash Series", map: "Purgatory", time: "Tomorrow, 04:00 PM", prize: "₹500", perKill: "₹5", entryFee: 15, spotsLeft: 5, totalSpots: 25, joined: true, roomId: "FF_4412", roomPass: "ffpro123" }
        ];

        function renderTournaments() {
            const listEl = document.getElementById('tournament-list');
            listEl.innerHTML = '';
            tournaments.forEach((t, index) => {
                listEl.innerHTML += `
                    <div class="card">
                        <div class="card-title">${t.title} <span class="badge">${t.map}</span></div>
                        <div class="match-info">🕒 ${t.time}</div>
                        <div class="stats-row">
                            <div class="stat-box"><div>Prize Pool</div><div class="prize">${t.prize}</div></div>
                            <div class="stat-box"><div>Per Kill</div><div class="per-kill">${t.perKill}</div></div>
                            <div class="stat-box"><div>Spots Left</div><div class="spots">${t.spotsLeft}/${t.totalSpots}</div></div>
                        </div>
                        <button class="btn ${t.joined ? 'btn-joined' : 'btn-join'}" ${t.joined ? 'disabled' : ''} onclick="joinMatch(${index})">
                            ${t.joined ? 'Joined Successfully' : 'Join Match (₹' + t.entryFee + ')'}
                        </button>
                    </div>
                `;
            });

            const joinedEl = document.getElementById('joined-list');
            const joinedMatches = tournaments.filter(t => t.joined);
            if(joinedMatches.length === 0) {
                joinedEl.innerHTML = '<div style="text-align: center; color: #94A3B8; margin-top: 40px;">You have not joined any matches yet.</div>';
            } else {
                joinedEl.innerHTML = '';
                joinedMatches.forEach(t => {
                    joinedEl.innerHTML += `
                        <div class="card">
                            <div class="card-title">${t.title}</div>
                            <div class="room-box">
                                <div>
                                    <div style="color: #34D399; font-weight: bold;">Room ID: ${t.roomId}</div>
                                    <div style="color: #FB923C; font-weight: bold;">Password: ${t.roomPass}</div>
                                </div>
                                <span style="font-size: 20px;">🔓</span>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function joinMatch(index) {
            if(walletBalance >= tournaments[index].entryFee) {
                walletBalance -= tournaments[index].entryFee;
                tournaments[index].joined = true;
                tournaments[index].spotsLeft -= 1;
                updateWalletUI();
                renderTournaments();
                alert('Successfully Joined Tournament!');
            } else {
                alert('Insufficient Wallet Balance! Add money first.');
            }
        }

        function addMoney() {
            walletBalance += 100;
            updateWalletUI();
            alert('Added ₹100 test cash to wallet!');
        }

        function updateWalletUI() {
            document.getElementById('wallet-balance').innerText = walletBalance;
            document.getElementById('wallet-balance-box').innerText = '₹' + walletBalance;
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        renderTournaments();
    </script>
</body>
</html>
